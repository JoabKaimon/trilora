<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f8fc"><meta name="description" content="Planejador acadêmico: disciplinas, atividades e progresso em um só lugar"><title>Trilora — Sua rotina acadêmica</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#20263a;background:#f7f8fc}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.sidebar{background:#fff;border-right:1px solid #e8eaf2;width:248px;padding:30px 18px;display:flex;flex-direction:column;gap:36px;position:sticky;top:0;height:100vh}.logo{display:flex;gap:10px;align-items:center;font-size:24px;font-weight:800;color:#322a78;padding:0 14px}.logo-mark{background:#6356de;color:white;border-radius:13px;width:36px;height:36px;display:grid;place-items:center;font-size:23px}.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;text-align:left;border-radius:12px;padding:14px 16px;color:#788097;font-weight:650}.nav button.active,.nav button:hover{background:#f0eefe;color:#5649c6}.nav button span{display:inline-block;width:26px}.sidefoot{margin-top:auto;background:#f4f2ff;border-radius:15px;padding:18px;color:#69628d;font-size:13px;line-height:1.6}.sidefoot strong{display:block;color:#40368f;font-size:14px}.main{flex:1;max-width:1400px;margin:auto;padding:34px clamp(20px,4vw,64px);width:100%}.top{display:flex;justify-content:space-between;align-items:center;gap:16px}.eyebrow{font-size:13px;color:#8a90a3;font-weight:700;letter-spacing:.08em;text-transform:uppercase}h1{font-size:31px;letter-spacing:-.04em;margin:5px 0 7px}h2{font-size:20px;letter-spacing:-.025em;margin:0}p{color:#8a90a3;margin:0}.avatar{width:43px;height:43px;border-radius:50%;background:#e9e5ff;color:#6454c8;display:grid;place-items:center;font-weight:800}.hero{background:linear-gradient(110deg,#5e53d5,#8978e5);border-radius:22px;margin:28px 0;color:white;padding:28px 34px;display:flex;justify-content:space-between;align-items:center;overflow:hidden;position:relative}.hero:after{content:'✦';font-size:210px;position:absolute;right:70px;top:-90px;color:#ffffff18}.hero h2{font-size:25px;margin:0 0 8px}.hero p{color:#e9e5ff;max-width:500px;line-height:1.6}.hero button{border:0;border-radius:11px;background:white;color:#5b4fd1;font-weight:800;padding:13px 18px;white-space:nowrap;z-index:1}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:27px}.stat,.panel{background:white;border:1px solid #edf0f5;border-radius:18px;padding:22px;box-shadow:0 5px 25px #172c5b05}.stat small{color:#8c92a5;font-weight:650}.stat strong{display:block;font-size:30px;margin-top:12px;letter-spacing:-.04em}.stat .sub{font-size:12px;color:#8c92a5;margin-top:8px}.content{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:22px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:12px}.linkbtn{background:none;border:0;color:#6556d3;font-weight:750;font-size:13px}.task{display:flex;align-items:center;gap:13px;padding:15px 0;border-top:1px solid #f0f1f5}.task:first-of-type{border:0}.check{width:21px;height:21px;accent-color:#6a5bdb;cursor:pointer}.taskinfo{flex:1;min-width:0}.taskinfo b{font-size:14px;display:block;overflow-wrap:anywhere}.taskinfo small{color:#9299aa;font-size:12px}.done b{text-decoration:line-through;color:#a0a5b3}.chip{font-size:11px;font-weight:750;padding:6px 9px;border-radius:8px;white-space:nowrap}.alta{background:#fff0f0;color:#e16a73}.media{background:#fff7e8;color:#db9950}.baixa{background:#eef8f1;color:#4ba476}.empty{padding:24px;text-align:center;color:#9ba1ae;font-size:14px}.progress{height:9px;background:#efeff8;border-radius:99px;overflow:hidden;margin:12px 0}.bar{height:100%;background:#7668df;border-radius:99px}.subject{padding:15px 0;border-top:1px solid #f0f1f5}.subject:first-of-type{border:0}.subjectrow{display:flex;align-items:center;gap:10px}.dot{height:11px;width:11px;border-radius:50%;flex:none}.subjectrow b{font-size:14px;flex:1}.subjectrow small{color:#979eb0}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}.primary{background:#6455d8;border:0;color:white;border-radius:11px;padding:12px 17px;font-weight:750}.secondary{background:white;border:1px solid #e5e7ee;border-radius:11px;padding:11px 15px;font-weight:700;color:#5c6073}.field{border:1px solid #e1e5ed;border-radius:10px;background:#fff;padding:11px 13px;min-width:0}.toolbar .field{flex:1}.row{display:flex;gap:12px;align-items:center}.calendarhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.dayname{text-align:center;color:#9297a6;font-weight:800;font-size:12px;padding:9px 0}.day{min-height:90px;border:1px solid #eaecf3;border-radius:10px;padding:10px;background:#fff;font-size:13px;color:#51586f}.day.outside{opacity:.35}.day.today{border:2px solid #7668df}.day em{display:block;font-style:normal;background:#eeeaff;color:#5d52c8;border-radius:5px;padding:4px;margin-top:5px;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.overlay{position:fixed;inset:0;background:#18213c80;z-index:5;display:grid;place-items:center;padding:20px}.modal{background:#fff;border-radius:20px;padding:28px;width:min(100%,480px);box-shadow:0 20px 80px #15193636}.modal h2{margin-bottom:22px}.form{display:grid;gap:15px}.form label{font-size:13px;font-weight:750;color:#5e6578;display:grid;gap:7px}.form input,.form select{width:100%}.form .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:8px}.hidden{display:none!important}.delete{border:0;background:transparent;color:#c4a3a6;font-size:18px}.delete:hover{color:#cb5365}.notice{font-size:12px;color:#98a0af;margin-top:18px}.mobilebar{display:none}@media(max-width:900px){.sidebar{width:78px;padding:22px 10px}.logo{font-size:0;padding:0;justify-content:center}.nav button{font-size:0;text-align:center}.nav button span{font-size:20px;width:auto}.sidefoot{display:none}.content{grid-template-columns:1fr}}@media(max-width:600px){.app{display:block}.sidebar{display:none}.mobilebar{display:flex;position:sticky;bottom:0;background:white;border-top:1px solid #e8eaf2;z-index:3;justify-content:space-around;padding:9px}.mobilebar button{border:0;background:none;color:#7b8190;font-size:12px;padding:8px}.mobilebar button.active{color:#6455d8;font-weight:800}.main{padding:25px 17px}.hero{padding:23px;align-items:flex-start;gap:20px;flex-direction:column}.stats{gap:9px}.stat{padding:14px}.stat strong{font-size:23px}.stat small{font-size:11px}.content{gap:14px}.calendar{gap:3px}.day{min-height:65px;padding:5px;font-size:11px}.day em{font-size:8px}}
</style></head><body><div class="app"><aside class="sidebar"><div class="logo"><span class="logo-mark">✦</span> Trilora</div><nav class="nav" id="nav"><button data-page="dashboard" class="active"><span>▦</span> Visão geral</button><button data-page="tasks"><span>☑</span> Minhas tarefas</button><button data-page="subjects"><span>▤</span> Disciplinas</button><button data-page="calendar"><span>▦</span> Calendário</button></nav><div class="sidefoot"><strong>Seu espaço de estudos ✨</strong>Organize o semestre, acompanhe suas entregas e avance um dia de cada vez.</div></aside><main class="main"><div class="top"><div><div class="eyebrow">PLANEJAMENTO ACADÊMICO</div><h1 id="pagetitle">Seu painel de estudos 👋</h1><p id="subtitle">Tudo o que importa para seu semestre, em um só lugar.</p></div><div class="avatar">EU</div></div><div id="page"></div><div class="notice">Protótipo acadêmico • Seus dados são armazenados apenas neste navegador.</div></main></div><nav class="mobilebar" id="mobileNav"><button data-page="dashboard" class="active">⌂<br>Painel</button><button data-page="tasks">☑<br>Tarefas</button><button data-page="subjects">▤<br>Disciplinas</button><button data-page="calendar">▦<br>Calendário</button></nav><div id="modalroot"></div><script>
const K='trilora-v1';const today=new Date();const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};const add=n=>{let d=new Date();d.setDate(d.getDate()+n);return iso(d)};const demo={subjects:[{id:'s1',name:'Engenharia de Software',color:'#7363dc'},{id:'s2',name:'Estruturas de Dados',color:'#51b7a2'},{id:'s3',name:'Banco de Dados',color:'#f3ad67'}],tasks:[{id:'t1',title:'Entregar levantamento de requisitos',subject:'s1',date:add(2),priority:'Alta',done:false},{id:'t2',title:'Revisar árvores binárias',subject:'s2',date:add(4),priority:'Média',done:false},{id:'t3',title:'Modelar diagrama entidade-relacionamento',subject:'s3',date:add(7),priority:'Média',done:false},{id:'t4',title:'Definir proposta do projeto',subject:'s1',date:add(-1),priority:'Baixa',done:true}]};let data;try{data=JSON.parse(localStorage.getItem(K))||demo;if(!Array.isArray(data.tasks)||!Array.isArray(data.subjects))throw 0}catch{data=demo}let page='dashboard',filter='Todas',month=new Date(today.getFullYear(),today.getMonth(),1);const save=()=>localStorage.setItem(K,JSON.stringify(data));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const subj=id=>data.subjects.find(s=>s.id===id);const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'short'});const remaining=()=>data.tasks.filter(t=>!t.done);const percentage=()=>data.tasks.length?Math.round(100*data.tasks.filter(t=>t.done).length/data.tasks.length):0;function taskList(list){return list.length?list.map(t=>`<div class="task ${t.done?'done':''}"><input class="check" type="checkbox" aria-label="Concluir ${esc(t.title)}" data-toggle="${esc(t.id)}" ${t.done?'checked':''}><div class="taskinfo"><b>${esc(t.title)}</b><small>${esc(subj(t.subject)?.name||'Sem disciplina')} · ${fmt(t.date)}</small></div><span class="chip ${t.priority==='Alta'?'alta':t.priority==='Média'?'media':'baixa'}">${esc(t.priority)}</span><button class="delete" title="Excluir tarefa" aria-label="Excluir tarefa" data-delete-task="${esc(t.id)}">×</button></div>`).join(''):'<div class="empty">Nada por aqui. Adicione uma tarefa para começar ✨</div>'}function subjectList(){return data.subjects.length?data.subjects.map(s=>{const all=data.tasks.filter(t=>t.subject===s.id),done=all.filter(t=>t.done).length,pct=all.length?Math.round(done/all.length*100):0;return `<div class="subject"><div class="subjectrow"><i class="dot" style="background:${esc(s.color)}"></i><b>${esc(s.name)}</b><small>${done}/${all.length} tarefas</small><button class="delete" data-delete-subject="${esc(s.id)}" title="Excluir disciplina">×</button></div><div class="progress"><div class="bar" style="width:${pct}%;background:${esc(s.color)}"></div></div></div>`}).join(''):'<div class="empty">Nenhuma disciplina cadastrada.</div>'}function render(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const titles={dashboard:['Seu painel de estudos 👋','Tudo o que importa para seu semestre, em um só lugar.'],tasks:['Minhas tarefas','Organize entregas, provas e atividades.'],subjects:['Minhas disciplinas','Acompanhe suas matérias e seu progresso.'],calendar:['Calendário acadêmico','Visualize seus compromissos e prazos.']};document.getElementById('pagetitle').textContent=titles[page][0];document.getElementById('subtitle').textContent=titles[page][1];let html='';if(page==='dashboard'){html=`<section class="hero"><div><h2>Organize hoje. Conquiste amanhã. ✨</h2><p>Seu semestre fica mais leve quando cada tarefa tem seu lugar. Que tal planejar o próximo passo?</p></div><button data-add-task>+ Nova tarefa</button></section><section class="stats"><div class="stat"><small>Disciplinas</small><strong>${data.subjects.length}</strong><div class="sub">Em acompanhamento</div></div><div class="stat"><small>Tarefas pendentes</small><strong>${remaining().length}</strong><div class="sub">Para organizar</div></div><div class="stat"><small>Concluídas</small><strong>${percentage()}%</strong><div class="sub">Do total de atividades</div></div></section><div class="content"><section class="panel"><div class="sectionhead"><h2>Próximas tarefas</h2><button class="linkbtn" data-go="tasks">Ver todas →</button></div>${taskList(remaining().sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5))}</section><section class="panel"><div class="sectionhead"><h2>Suas disciplinas</h2><button class="linkbtn" data-add-subject>+ Adicionar</button></div>${subjectList()}</section></div>`}else if(page==='tasks'){let tasks=data.tasks.filter(t=>filter==='Todas'||(filter==='Pendentes'?!t.done:t.done)).sort((a,b)=>a.date.localeCompare(b.date));html=`<div class="toolbar"><select class="field" id="filter" aria-label="Filtrar tarefas"><option ${filter==='Todas'?'selected':''}>Todas</option><option ${filter==='Pendentes'?'selected':''}>Pendentes</option><option ${filter==='Concluídas'?'selected':''}>Concluídas</option></select><button class="primary" data-add-task>+ Nova tarefa</button></div><section class="panel">${taskList(tasks)}</section>`}else if(page==='subjects'){html=`<div class="toolbar"><button class="primary" data-add-subject>+ Nova disciplina</button></div><section class="panel">${subjectList()}</section>`}else{let yy=month.getFullYear(),mm=month.getMonth(),first=(new Date(yy,mm,1).getDay()+6)%7,last=new Date(yy,mm+1,0).getDate();let cells=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(d=>`<div class="dayname">${d}</div>`).join('');for(let i=0;i<Math.ceil((first+last)/7)*7;i++){const n=i-first+1,isOut=n<1||n>last,d=iso(new Date(yy,mm,n)),events=data.tasks.filter(t=>t.date===d);cells+=`<div class="day ${isOut?'outside':''} ${d===iso(today)?'today':''}">${n>0&&n<=last?n:''}${events.slice(0,3).map(t=>`<em title="${esc(t.title)}">${esc(t.title)}</em>`).join('')}</div>`}html=`<div class="toolbar"><button class="primary" data-add-task>+ Nova tarefa</button></div><section class="panel"><div class="calendarhead"><button class="secondary" data-month="-1">‹</button><h2>${month.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</h2><button class="secondary" data-month="1">›</button></div><div class="calendar">${cells}</div></section>`}document.getElementById('page').innerHTML=html}function openModal(type){if(type==='task'&&!data.subjects.length){alert('Cadastre uma disciplina antes de adicionar uma tarefa.');page='subjects';render();return}let task=type==='task';document.getElementById('modalroot').innerHTML=`<div class="overlay" id="overlay"><div class="modal" role="dialog" aria-modal="true" aria-label="${task?'Nova tarefa':'Nova disciplina'}"><h2>${task?'Criar nova tarefa':'Adicionar disciplina'}</h2><form class="form" id="addform">${task?`<label>Título da tarefa<input class="field" name="title" maxlength="120" required placeholder="Ex.: Revisar capítulo 2"></label><label>Disciplina<select class="field" name="subject">${data.subjects.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('')}</select></label><label>Prazo<input class="field" type="date" name="date" value="${add(1)}" required></label><label>Prioridade<select class="field" name="priority"><option>Média</option><option>Alta</option><option>Baixa</option></select></label>`:`<label>Nome da disciplina<input class="field" name="name" maxlength="80" required placeholder="Ex.: Cálculo I"></label><label>Cor de identificação<input class="field" type="color" name="color" value="#7363dc"></label>`}<div class="actions"><button class="secondary" type="button" data-close>Cancelar</button><button class="primary" type="submit">Salvar</button></div></form></div></div>`;const overlay=document.getElementById('overlay');overlay.addEventListener('click',e=>{if(e.target===overlay||e.target.closest('[data-close]'))closeModal()});document.getElementById('addform').addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.target);if(task)data.tasks.push({id:crypto.randomUUID(),title:String(f.get('title')).trim(),subject:f.get('subject'),date:f.get('date'),priority:f.get('priority'),done:false});else data.subjects.push({id:crypto.randomUUID(),name:String(f.get('name')).trim(),color:f.get('color')});save();closeModal();render()});overlay.querySelector('input')?.focus()}function closeModal(){document.getElementById('modalroot').innerHTML=''}document.addEventListener('click',e=>{let el=e.target.closest('button');if(!el)return;if(el.dataset.page){page=el.dataset.page;render()}else if(el.dataset.go){page=el.dataset.go;render()}else if(el.hasAttribute('data-add-task'))openModal('task');else if(el.hasAttribute('data-add-subject'))openModal('subject');else if(el.dataset.month){month=new Date(month.getFullYear(),month.getMonth()+Number(el.dataset.month),1);render()}else if(el.dataset.deleteTask){if(confirm('Excluir esta tarefa?')){data.tasks=data.tasks.filter(t=>t.id!==el.dataset.deleteTask);save();render()}}else if(el.dataset.deleteSubject){if(data.tasks.some(t=>t.subject===el.dataset.deleteSubject)){alert('Remova as tarefas desta disciplina antes de excluí-la.');return}if(confirm('Excluir esta disciplina?')){data.subjects=data.subjects.filter(s=>s.id!==el.dataset.deleteSubject);save();render()}}});document.addEventListener('change',e=>{if(e.target.dataset.toggle){const t=data.tasks.find(t=>t.id===e.target.dataset.toggle);if(t)t.done=e.target.checked;save();render()}if(e.target.id==='filter'){filter=e.target.value;render()}});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});save();render();
</script></body></html>
